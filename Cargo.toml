[package]
name = "sued-rs"
version = "0.1.2"
edition = "2024"
# Two independent things land on 1.88, which is why this is the number:
#   - `app.rs`'s quit-confirm guard uses a LET-CHAIN, stable in edition 2024 at 1.88
#   - the ratatui 0.30 family (and `time`) each declare `rust-version = "1.88.0"`
# Edition 2024 alone would only demand 1.85. Verified against every crate in
# Cargo.lock, not just the direct dependencies. Keep in step with the README.
rust-version = "1.88"
description = "A horror-themed terminal recreation of SueD, the 2000s Brazilian prank oracle."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Danilo-Guedes/sued-rs"
readme = "README.md"
keywords = ["ratatui", "prank", "tui", "game", "horror"]
categories = ["command-line-utilities", "games"]
# The README's screenshots are served from GitHub by absolute URL, so the files
# themselves are dead weight inside the crate — someone who ran `cargo install`
# will never open them. Keep them out of the tarball.
exclude = ["docs/"]

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
# `unstable-rendered-line-info` unlocks `Paragraph::line_count()` — used on the
# About screen to size the lore's Rect to its exact wrapped height (no clipping).
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Audio is optional so the project builds with no ALSA headers (M1 doesn't use it).
# Flip `default = ["audio"]` at M3 once sound is wired in.
kira = { version = "0.12.2", optional = true, default-features = false, features = ["cpal", "cpal-realtime", "ogg", "vorbis"] }
rand = "0.10.2"
dirs = "6.0.0"

[features]
default = ["audio"]
audio = ["dep:kira"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
